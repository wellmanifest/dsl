name: dsl-ci

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: >-
      (github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
      (github.event.action == 'submitted' ||
      (github.event.action == 'dismissed' &&
      github.event.review.commit_id == github.event.pull_request.head.sha)))
    permissions:
      contents: read
      pull-requests: read
    uses: wellmanifest/new-project/.github/workflows/governance.yml@a22eb47ca0e7c06ac927d1c0d843eabb798bfadd
    with:
      standard-ref: a22eb47ca0e7c06ac927d1c0d843eabb798bfadd
      trusted-validator-apps: 'ifuri-validator-agent[bot]'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Install pinned validation tools
        run: >-
          python3 -m pip install --disable-pip-version-check
          'jsonschema==4.25.1' 'ruff==0.15.21'
      - name: Resolve exact change boundary
        id: revision
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE_SHA"
          mode=range
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'event head is not an exact Git SHA' >&2
            exit 1
          fi
          git cat-file -e "$EVENT_HEAD_SHA^{commit}"
          if [[ ("$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch) &&
                "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            mode=repository
          else
            if [[ "$EVENT_NAME" != pull_request &&
                  "$EVENT_NAME" != pull_request_review ]]; then
              git fetch --no-tags origin \
                "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              base="$(git merge-base "origin/$DEFAULT_BRANCH" "$EVENT_HEAD_SHA")"
            elif [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            git cat-file -e "$base^{commit}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Validate required check contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          contract = json.loads(Path('.governance/required-checks.json').read_text())
          required = contract['requiredCheckNames']
          workflow = Path('.github/workflows/ci.yml').read_text().splitlines()
          in_jobs = False
          jobs = []
          for line in workflow:
              if line == 'jobs:':
                  in_jobs = True
                  continue
              if not in_jobs:
                  continue
              if line and not line.startswith(' '):
                  break
              match = re.fullmatch(r'  ([A-Za-z0-9][A-Za-z0-9_-]*):', line)
              if match:
                  jobs.append(match.group(1))
          published = [job for job in jobs if job != 'governance']
          if published != required:
              raise SystemExit(
                  f'required check drift: required={required!r} published={published!r}'
              )
          print(f'required checks PASS: {published}')
          PY
      - name: Validate JSON and JSON Schema contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' document; do
            python3 -m json.tool "$document" >/dev/null
          done < <(find .governance schemas -type f -name '*.json' -print0 2>/dev/null || true)
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in sorted(Path('.').glob('**/*schema.json')):
              if any(part in {'.git', '.venv', 'node_modules'} for part in path.parts):
                  continue
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(f'metaschema PASS: {path}')
          PY
      - name: Run deterministic host checks
        shell: bash
        env:
          BASE_SHA: ${{ steps.revision.outputs.base }}
          HEAD_SHA: ${{ steps.revision.outputs.head }}
          VALIDATION_MODE: ${{ steps.revision.outputs.mode }}
        run: |
          set -euo pipefail
          python3 -m py_compile .governance/*.py
          if [[ -f src/dsl_check.py ]]; then
            python3 -m py_compile src/dsl_check.py
            ruff format --check src/dsl_check.py
            ruff check src/dsl_check.py
            python3 src/dsl_check.py self-test
          fi
          governance_args=(
            --root .
            --manifest .governance/manifest.json
            --lock .governance/manifest.lock.json
            --stack-profiles .governance/stack-profiles.json
            --actor ci
          )
          case "$VALIDATION_MODE" in
            range) governance_args+=(--base "$BASE_SHA" --head "$HEAD_SHA") ;;
            repository) governance_args+=(--changed-file project/TICKETS.md) ;;
            *) echo "unknown validation mode: $VALIDATION_MODE" >&2; exit 1 ;;
          esac
          python3 .governance/governance_check.py "${governance_args[@]}"
      - name: Run networkless Docker checks
        shell: bash
        env:
          BASE_SHA: ${{ steps.revision.outputs.base }}
          HEAD_SHA: ${{ steps.revision.outputs.head }}
          VALIDATION_MODE: ${{ steps.revision.outputs.mode }}
        run: |
          set -euo pipefail
          docker build -t wellmanifest-dsl-ci .
          changed_args=()
          case "$VALIDATION_MODE" in
            range)
              while IFS= read -r -d '' path; do
                changed_args+=(--changed-file "$path")
              done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")
              if [[ "${#changed_args[@]}" -eq 0 ]]; then
                echo 'protected change set is empty' >&2
                exit 1
              fi
              ;;
            repository) changed_args+=(--changed-file project/TICKETS.md) ;;
            *) echo "unknown validation mode: $VALIDATION_MODE" >&2; exit 1 ;;
          esac
          docker run --rm --network none wellmanifest-dsl-ci \
            python3 .governance/governance_check.py \
              --root . \
              --manifest .governance/manifest.json \
              --lock .governance/manifest.lock.json \
              --stack-profiles .governance/stack-profiles.json \
              --actor ci \
              "${changed_args[@]}"
          if [[ -f src/dsl_check.py ]]; then
            docker run --rm --network none wellmanifest-dsl-ci \
              python3 src/dsl_check.py self-test
          fi

  windows-governance:
    runs-on: windows-latest
    steps:
      - name: Preserve managed LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Validate Windows governance entrypoints
        shell: pwsh
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:EVENT_BASE_SHA
          $repositoryMode = (
            ($env:EVENT_NAME -eq 'push' -or $env:EVENT_NAME -eq 'workflow_dispatch') -and
            $env:REF_NAME -eq $env:DEFAULT_BRANCH
          )
          if ($env:EVENT_HEAD_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'event head is not an exact Git SHA'
          }
          git cat-file -e "$env:EVENT_HEAD_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "missing head commit $env:EVENT_HEAD_SHA" }
          if (-not $repositoryMode) {
            if (
              $env:EVENT_NAME -ne 'pull_request' -and
              $env:EVENT_NAME -ne 'pull_request_review'
            ) {
              git fetch --no-tags origin "refs/heads/$($env:DEFAULT_BRANCH):refs/remotes/origin/$($env:DEFAULT_BRANCH)"
              if ($LASTEXITCODE -ne 0) { throw 'default branch fetch failed' }
              $base = (git merge-base "origin/$env:DEFAULT_BRANCH" $env:EVENT_HEAD_SHA).Trim()
            } elseif ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
              $base = (git rev-parse 'HEAD^').Trim()
            }
            git cat-file -e "$base^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "missing base commit $base" }
          }
          Get-ChildItem .governance -Filter '*.json' | ForEach-Object {
            python -m json.tool $_.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "invalid JSON: $($_.FullName)" }
          }
          if ($repositoryMode) {
            ./project.bat --actor ci --changed-file project/TICKETS.md
          } else {
            ./project.bat --actor ci --base $base --head $env:EVENT_HEAD_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows governance failed' }
